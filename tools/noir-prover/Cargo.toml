[package]
name = "noir-prover"
version = "0.1.0"
edition = "2024"

[dependencies]
acir = { git = "https://github.com/noir-lang/noir", package = "acir", rev = "v1.0.0-beta.18", features = ["bn254"] }
acvm = { git = "https://github.com/noir-lang/noir", package = "acvm", rev = "v1.0.0-beta.18" }
serde = { version = "1.0", features = ["derive"] }
k256 = { version = "0.13.4", features = ["ecdsa", "ecdsa-core", "sha256", "digest", "arithmetic"] }
p256 = { version = "0.13.2", features = ["ecdsa", "ecdsa-core", "sha256", "digest", "arithmetic"] }
